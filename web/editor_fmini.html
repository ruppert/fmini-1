<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMini-1 Editor</title>
<!-- SPDX-License-Identifier: GPL-3.0-only
     FMini-1 patch editor: one self-contained page, Web MIDI + SysEx (Chrome / Edge / Android).
     Protocol: web/EDITOR_PROTOCOL.md (cmds 2 GET, 3 SET, 4 DUMP, 5 DESC, 8 PRESET, 10 NAMES, 27 TRACK, 82/83 FMINI_GET/PUT). -->
<style>
  :root {
    --bg: #0d0c10; --surface: #15131a; --surface2: #1c1922; --line: #2a2631; --fg: #f4f0ea; --dim: #a29cab; --mute: #6f6a78;
    --or: #ff7a1a; --or2: #ff9a4d; --ok: #7bd88f; --bad: #ff7a6a; --wood: #3a2616;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 15px/1.5 var(--sans); background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: var(--or2); }
  button, select { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  header.top { background: linear-gradient(#4a301b, #2e1d10); border-bottom: 3px solid #17100a; }
  header.top .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: .04em; font-weight: 700; }
  h1 small { color: var(--or2); font-weight: 600; margin-left: 6px; letter-spacing: 0; font-size: 13px; }
  .grow { flex: 1; }
  .btn { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--mute); }
  .btn.pri { background: var(--or); color: #1a0e05; border-color: var(--or); font-weight: 700; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mute); margin-right: 7px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status { font-size: 13.5px; color: var(--dim); }

  .notice { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--or); border-radius: 8px; background: var(--surface); color: var(--dim); }
  .notice.bad { border-left-color: var(--bad); }
  .notice b { color: var(--fg); }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; }
  .bar select { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; max-width: 100%; }
  #preset { flex: 1; min-width: 160px; }
  .sq { width: 38px; padding: 7px 0; text-align: center; }

  nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--dim); font-weight: 600; letter-spacing: .05em; font-size: 13px; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--or2); border-bottom-color: var(--or); }

  main.panel { margin: 18px 0 40px; padding: 22px 18px 26px; background: linear-gradient(#1c1922, #15131a); border: 1px solid var(--line); border-radius: 14px; min-height: 280px; }
  .grp { margin-bottom: 22px; }
  .grp:last-child { margin-bottom: 0; }
  .grp h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .14em; color: var(--mute); font-weight: 700; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-start; }

  .knob { width: 84px; text-align: center; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; cursor: ns-resize; }
  .knob svg { width: 70px; height: 70px; display: block; margin: 0 auto; }
  .knob .ring { fill: none; stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
  .knob .arc { fill: none; stroke: var(--or); stroke-width: 4; stroke-linecap: round; }
  .knob .cap { fill: url(#cap); stroke: #000; stroke-width: 1; }
  .knob .tick { stroke: #1a1a1a; stroke-width: 3; stroke-linecap: round; }
  .knob:focus-visible svg { outline: 2px solid var(--or2); outline-offset: 2px; border-radius: 50%; }
  .knob .lb { font-size: 11.5px; letter-spacing: .08em; color: var(--dim); margin-top: 2px; font-weight: 600; }
  .knob .val { font: 600 13px var(--mono); color: var(--or2); }

  .sw { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 0; width: 84px; }
  .sw i { width: 46px; height: 22px; border-radius: 11px; background: #0f0e0d; border: 1px solid var(--line); position: relative; transition: background .12s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #8d8d8b; transition: left .12s, background .12s; }
  .sw[aria-pressed="true"] i { background: var(--or); border-color: var(--or); }
  .sw.blue[aria-pressed="true"] i { background: #2f7fe0; border-color: #2f7fe0; }
  .sw.red[aria-pressed="true"] i { background: #d6382b; border-color: #d6382b; }
  .sw[aria-pressed="true"] i::after { left: 26px; background: #fff; }
  .sw span { font-size: 11.5px; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .sw:focus-visible i { outline: 2px solid var(--or2); outline-offset: 2px; }

  .seg { display: flex; flex-direction: column; gap: 7px; min-width: 150px; }
  .seg .t { font-size: 11.5px; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .seg .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { background: #0f0e0d; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; font: 600 12px var(--mono); color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--or); border-color: var(--or); color: #1a0e05; }
  .sel { display: flex; flex-direction: column; gap: 7px; width: 120px; }
  .sel .t { font-size: 11.5px; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .sel select { background: #0f0e0d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }

  .tools { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 0 0 12px; color: var(--dim); font-size: 13px; }
  .tools label { display: inline-flex; align-items: center; gap: 8px; }
  .tools input[type=range] { width: 110px; accent-color: var(--or); }
  #ab { min-width: 74px; font-weight: 700; }
  #ab b { color: var(--or2); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
  .slot { background: #0f0e0d; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .slot .sn { font: 700 11.5px var(--mono); color: var(--or2); letter-spacing: .06em; }
  .slot .nm { font: 600 14px var(--mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 21px; }
  .slot.empty .nm, .slot.other .nm { color: var(--mute); font-weight: 400; }
  .slot .act { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .mini { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
  .mini:hover { border-color: var(--mute); }
  .mini.warn:hover { border-color: var(--bad); color: var(--bad); }
  .libname { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #busy { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--or); color: #1a0e05; font-weight: 700; padding: 10px 18px; border-radius: 10px; box-shadow: 0 6px 28px #000a; z-index: 9; max-width: 92vw; text-align: center; }
  #busy[hidden] { display: none; }
  .busy .bar, .busy nav.tabs, .busy main.panel, .busy .tools { pointer-events: none; opacity: .5; }
  footer { color: var(--mute); font-size: 12.5px; padding: 0 0 30px; }
  footer .wrap > * { margin: 4px 0; }
  .off main.panel, .off .bar, .off nav.tabs { opacity: .35; pointer-events: none; }
  @media (max-width: 560px) { .knob, .sw { width: 72px; } .row { gap: 16px 14px; } main.panel { padding: 18px 12px; } }
</style>
</head>
<body class="off">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="cap" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f4f4f2"/><stop offset=".55" stop-color="#9a9a98"/><stop offset="1" stop-color="#55554f"/></radialGradient>
</defs></svg>

<header class="top"><div class="wrap">
  <h1>FMini-1 <small data-t="editor">Editor</small></h1>
  <span class="grow"></span>
  <span id="status"><span class="dot" id="dot"></span><span id="stxt"></span></span>
  <select id="port" class="btn" hidden aria-label="MIDI"></select>
  <button class="btn pri" id="connect"></button>
</div></header>

<div class="wrap" id="body">
  <div id="msg"></div>
  <div class="bar">
    <button class="btn sq" id="prev" aria-label="-">◀</button>
    <select id="preset" aria-label="Patch"></select>
    <button class="btn sq" id="next" aria-label="+">▶</button>
    <button class="btn" id="save" data-t="save"></button>
    <button class="btn" id="load" data-t="open"></button>
    <input type="file" id="file" accept=".bkp,.json,application/json" hidden>
  </div>
  <div class="tools">
    <button class="btn" id="rnd"></button>
    <label><span data-t="amt"></span><input type="range" id="amt" min="5" max="100" value="35" aria-label="amount"><b id="amtv">35%</b></label>
    <span class="grow"></span>
    <button class="btn" id="ab" title="A/B"></button>
    <button class="btn" id="abcopy"></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="panel" id="panel"></main>
</div>

<div id="busy" hidden role="status"></div>

<footer><div class="wrap">
  <div data-t="foot1"></div>
  <div><a href="./" data-t="home"></a> · <a href="https://github.com/ruppert/fmini-1" rel="noopener">GitHub</a></div>
</div></footer>

<script>
"use strict";
/* ------------------------------------------------------------------ texts --- */
const TX = {
  pt: { editor: "Editor", connect: "Conectar", disconnect: "Desconectar", connecting: "Conectando…", disc: "Desconectado",
    conn: "Conectado — FMini-1", save: "Salvar som", open: "Abrir som", home: "Site do FMini-1",

    getlink: "Abrir o instalador atual",
    noext: "Atualização disponível: instale o FMini-1 v1.6.1 ou mais novo para editar a oitava e guardar tempo, oitava e efeitos na biblioteca.",
    noenv: "Atualização necessária: este firmware não tem o editor de osciladores e chaves. Instale a versão mais nova pelo site para editar tudo.",
    nonames: "Atualização disponível: este firmware envia só os nomes dos %n primeiros presets. Instale o FMini-1 v1.7.2 ou mais novo para ver todos.",
    noeng: "A trilha 1 não está com o motor FMINI.", lost: "A conexão com o aparelho foi perdida.", timeout: "O aparelho não respondeu.",
    badfile: "Arquivo de som inválido.", rnd: "Aleatorizar", amt: "Variação", abcopy: "Copiar A → B", abcopyb: "Copiar B → A", abtip: "Alterna entre dois ajustes para comparar",
    lib: "PRESETS", libload: "Carregar", libempty: "— vazio —", libtitle: "Presets do aparelho (000–199)", factexp: "Exportar banco de fábrica",
    bakexp: "Fazer backup (.bkp)", bakimp: "Restaurar backup (.bkp)", busybak: "Lendo os 200 presets…", bakdone: "Backup salvo.",
    busyrest: "Gravando os 200 presets… não desconecte o USB.", waitdev: "Confirme no aparelho: ALGORITHM = YES, depois SAVE. Qualquer botão de página cancela.",
    restdone: "Presets restaurados.", refused: "Restauração recusada no aparelho (ou sem resposta).", restfail: "Falhou ao gravar no aparelho. Os presets gravados até aqui ficaram; refaça a restauração.",
    badbkp: "Arquivo de backup inválido.", recfail: "O aparelho não devolveu um preset.",
    libhint: "000–099 are factory presets; 100–199 start as INIT. To store the sound that is playing into a slot, use SAVE on the device. Over MIDI (Program Change) only the numbers 0–127 are reachable.", busyfact: "Lendo o banco de fábrica…", busyread: "Lendo…", factdone: "Banco de fábrica exportado.", loaded: "Som carregado no aparelho.", saved: "Som salvo em arquivo." },
  en: { editor: "Editor", connect: "Connect", disconnect: "Disconnect", connecting: "Connecting…", disc: "Disconnected",
    conn: "Connected — FMini-1", save: "Save sound", open: "Open sound", home: "FMini-1 site",
    foot1: "Works in Chrome, Edge and Android (Web MIDI with SysEx). Edits change the sound that is playing; to keep it, use the device's own SAVE.",
    nomidi: "This browser has no Web MIDI with SysEx. Use Chrome or Edge (desktop) or Chrome on Android.",
    denied: "The browser denied MIDI access. Allow “MIDI” in the site permissions and try again.",
    none: "No FM-1 found. Plug in the USB cable, close other programs using the MIDI port and press Connect.",
    pick: "Pick the FM-1's MIDI port in the list and press Connect.",
    noedit: "This firmware does not look like the FMini-1. The editor is for the FMini-1 only.",
    oldfw: "This FMini-1 runs an old firmware. Update it with the current installer and connect again.",
    getlink: "Open the current installer",
    noext: "Update available: install FMini-1 v1.6.1 or newer to edit the octave and keep tempo, octave and effects in the library.",
    noenv: "Update needed: this firmware has no oscillator / switch editing. Install the newest version from the site to edit everything.",
    nonames: "Update available: this firmware sends only the names of the first %n presets. Install FMini-1 v1.7.2 or newer to see them all.",
    noeng: "Track 1 is not on the FMINI engine.", lost: "The connection to the device was lost.", timeout: "The device did not answer.",
    badfile: "Invalid sound file.", rnd: "Randomize", amt: "Amount", abcopy: "Copy A → B", abcopyb: "Copy B → A", abtip: "Switch between two settings to compare",
    lib: "PRESETS", libload: "Load", libempty: "— empty —", libtitle: "Device presets (000–199)", factexp: "Export factory bank",
    bakexp: "Make backup (.bkp)", bakimp: "Restore backup (.bkp)", busybak: "Reading the 200 presets…", bakdone: "Backup saved.",
    busyrest: "Writing the 200 presets… do not unplug USB.", waitdev: "Confirm on the device: ALGORITHM = YES, then SAVE. Any page button cancels.",
    restdone: "Presets restored.", refused: "Restore refused on the device (or no answer).", restfail: "The device refused a write. The presets written so far stay; run the restore again.",
    badbkp: "Invalid backup file.", recfail: "The device did not return a preset.",
    libhint: "“Save here” stores the sound that is playing in the device: the patch, the knobs, the tempo, the octave and the effect settings.", busyfact: "Reading the factory bank…", busyread: "Reading…", factdone: "Factory bank exported.", loaded: "Sound loaded into the device.", saved: "Sound saved to a file." },
};
const LANG = /^pt/i.test(navigator.language || "") ? "pt" : "en";
const T = (k, o) => { let t = TX[LANG][k] || k; for (const x in o || {}) t = t.replace("%" + x, o[x]); return t; };
document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";

/* ---------------------------------------------------------------- protocol --- */
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, PRESET: 8, NAMES: 10, TRACK: 27, FMINI_GET: 82, FMINI_PUT: 83, FMINI_PRESET: 84, FMINI_REC: 85, FMINI_RPUT: 86, FMINI_RESTORE: 87 };
const FG = { R1: 0, R2: 1, R3: 2, W1: 3, W2: 4, W3: 5, F2: 6, F3: 7, L1: 8, L2: 9, L3: 10, LN: 11, SW1: 12, SW2: 13, TUNE: 14, MMIX: 15, KBD: 16, GLID: 17, SIZE: 32 };
const FS = { O1: 1, O2: 2, O3: 4, NZ: 8, PINK: 16, MOSC: 32, MFLT: 64 }, FT = { GLIDE: 1, SQR: 2 };
/* track parameters (core.h; all but E0..E7 are fixed ids) and globals */
const P = { LEVEL: 0, ATK: 1, DEC: 2, SUS: 3, REL: 4, LRATE: 9, AMODE: 17, ARATE: 18, AOCT: 19, AGATE: 20, DIST: 33, CHOR: 34, DLY: 35, REV: 36, VOICE: 37, GLIDE: 38 };
const G = { BPM: 0, DTIME: 4, DFDBK: 5, RSIZE: 8, RDAMP: 9, CRATE: 10, CDEPTH: 11, MIDI: 12, INFO: 15, ENGGO: 21, RTYPE: 24, DRLVL: 25, DRREV: 26 };

const v14 = (n) => { n = Math.max(-8192, Math.min(8191, Math.round(n))) + 8192; return [n & 127, n >> 7]; };
const rv = (a, i) => (a[i] | (a[i + 1] << 7)) - 8192;
const cstr = (a, i) => { let s = ""; while (i < a.length && a[i]) s += String.fromCharCode(a[i++]); return [s, i + 1]; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const dev = { access: null, inp: null, out: null, waiter: null, chain: Promise.resolve(), open: false };

function onMsg(ev) {
  const d = ev.data;
  if (d[0] !== 0xF0 || d[1] !== 0x7D || d[2] !== 0x46 || d[3] !== 0x4C || !dev.waiter || dev.waiter.cmd !== d[4]) return;
  const w = dev.waiter; dev.waiter = null;
  w.res(Array.from(d.slice(5, d.length - 1)));
}
function req(cmd, args = [], ms = 900) {
  const p = dev.chain.then(() => new Promise((res, rej) => {
    if (!dev.out || dev.out.state === "disconnected") return rej(new Error("lost"));
    const t = setTimeout(() => { dev.waiter = null; rej(new Error("timeout")); }, ms);
    dev.waiter = { cmd, res: (a) => { clearTimeout(t); res(a); } };
    try { dev.out.send([0xF0, 0x7D, 0x46, 0x4C, cmd, ...args, 0xF7]); } catch (e) { clearTimeout(t); dev.waiter = null; rej(new Error("lost")); }
  }));
  dev.chain = p.catch(() => {});
  return p;
}

/* ------------------------------------------------------------------ state --- */
const S = {
  pe0: 103, patch: new Array(FG.SIZE).fill(0), p: [], g: [], slot: 0, engine: 0, fmini: -1, desc: {},
  names: [], canPatch: false, extras: false, oct: 0, page: 0,
};
const touch = { until: 0, dragging: 0 };
let pollTimer = 0, polling = false;

/* -------------------------------------------------------------- the panel --- */
/* kinds: byte (patch byte), par (track param), glb (global), sw (patch bit), seg (patch byte with names), sel (enum param / global),
   glide (the GLIDE knob: kept time, mirrored into P_GLIDE while the switch is on). pe: engine parameter n (P_E0 + n) */
const RANGES = ["LO", "32'", "16'", "8'", "4'", "2'"], WAVES = ["TRI", "SHARK", "SAW", "SQR", "PLS W", "PLS N"];
const PAGES = [
  { id: "CTRL", groups: [
    { t: "Controllers", c: [
      { k: "byte", b: FG.TUNE, lb: "TUNE", def: 64 }, { k: "glide", lb: "GLIDE" }, { k: "byte", b: FG.MMIX, lb: "MOD MIX", def: 0 },
      { k: "par", p: P.LRATE, lb: "LFO RATE" }, { k: "sel", p: P.VOICE, lb: "VOICES" },
      { k: "seg", oct: 1, names: ["-3", "-2", "-1", "0", "+1", "+2", "+3"], lb: "OCTAVE" } ] },
    { t: "Modulation", c: [
      { k: "sw", b: FG.SW1, bit: FS.MOSC, lb: "MOD OSC", cls: "red" }, { k: "sw", b: FG.SW1, bit: FS.MFLT, lb: "MOD FLT", cls: "red" },
      { k: "sw", b: FG.SW2, bit: FT.GLIDE, lb: "GLIDE", cls: "red", glide: 1 }, { k: "sw", b: FG.SW2, bit: FT.SQR, lb: "LFO SQR", cls: "red" } ] } ] },
  { id: "OSC", groups: [
    { t: "Oscillator bank", c: [
      { k: "seg", b: FG.R1, names: RANGES, lb: "OSC 1 RANGE" }, { k: "seg", b: FG.R2, names: RANGES, lb: "OSC 2 RANGE" }, { k: "seg", b: FG.R3, names: RANGES, lb: "OSC 3 RANGE" } ] },
    { t: "Waveform", c: [
      { k: "seg", b: FG.W1, names: WAVES, lb: "OSC 1 WAVE" }, { k: "seg", b: FG.W2, names: WAVES, lb: "OSC 2 WAVE" }, { k: "seg", b: FG.W3, names: WAVES, lb: "OSC 3 WAVE" } ] },
    { t: "Detune", c: [ { k: "byte", b: FG.F2, lb: "DET 2", def: 64 }, { k: "byte", b: FG.F3, lb: "DET 3", def: 64 } ] } ] },
  { id: "MIX", groups: [
    { t: "Mixer", c: [
      { k: "byte", b: FG.L1, lb: "OSC 1" }, { k: "byte", b: FG.L2, lb: "OSC 2" }, { k: "byte", b: FG.L3, lb: "OSC 3" }, { k: "byte", b: FG.LN, lb: "NOISE" } ] },
    { t: "Inputs", c: [
      { k: "sw", b: FG.SW1, bit: FS.O1, lb: "OSC 1", cls: "blue" }, { k: "sw", b: FG.SW1, bit: FS.O2, lb: "OSC 2", cls: "blue" },
      { k: "sw", b: FG.SW1, bit: FS.O3, lb: "OSC 3", cls: "blue" }, { k: "sw", b: FG.SW1, bit: FS.NZ, lb: "NOISE", cls: "blue" },
      { k: "sw", b: FG.SW1, bit: FS.PINK, lb: "PINK", cls: "blue" } ] } ] },

}
function applySnap(sn) {                                  /* what differs goes to the device */
  const octD = S.extras && sn.oct !== undefined && sn.oct !== S.oct;
  if (octD) S.oct = sn.oct;
  if (S.canPatch && sn.patch && (octD || sn.patch.some((x, i) => x !== S.patch[i]))) { S.patch = sn.patch.slice(); queue("patch", putPatch()); }
  for (const [k, v] of Object.entries(sn.p || {})) { const id = +k; if (id >= 0 && id < S.pCount && S.p[id] !== v) { S.p[id] = v; queue("p" + id, setPar(id)); } }
  for (const [k, v] of Object.entries(sn.g || {})) { const id = +k; if (id >= 0 && id < S.gCount && S.g[id] !== v) { S.g[id] = v; queue("g" + id, setGlb(id)); } }
  refreshAll();
}
/* the whole sound as a file object: the patch and every track parameter (kept by P_COUNT: the last 8 are E1..E8, as in user presets) */
function soundObject(name, patch, p, g, oct) { return { fmini1: 1, name: name || "", patch: patch.slice(), p: p.slice(), g: g || {}, oct: oct || 0 }; }
function currentSound(name) { const g = {}; for (const i of editable().g) g[i] = S.g[i]; return soundObject(name, S.patch, S.p, g, S.oct); }
function objectToSnap(o) {
  const sn = { patch: o.patch.map((x) => x & 127), oct: Math.max(-3, Math.min(3, o.oct | 0)), p: {}, g: o.g || {} };
  if (Array.isArray(o.p)) {
    const n = o.p.length, pc = S.pCount;
    for (let id = 0; id < pc; id++) {
      if (id === S.pe0 + 7) continue;                                   /* SLOT: the patch decides it */
      const v = id >= S.pe0 ? (n >= 8 ? o.p[n - 8 + (id - S.pe0)] : undefined) : id < n - 8 ? o.p[id] : undefined;
      if (v !== undefined) sn.p[id] = v | 0;
    }
  } else {                                                                /* (the first file format: only what the page edits) */
    for (const [k, v] of Object.entries(o.params || {})) sn.p[k[0] === "E" ? S.pe0 + +k.slice(1) : +k] = v | 0;
  }
  return sn;
}
const validSound = (o) => o && o.fmini1 === 1 && Array.isArray(o.patch) && o.patch.length === FG.SIZE && (Array.isArray(o.p) || typeof o.params === "object");
function download(obj, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: "application/json" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const slug = (n) => (n || "fmini-sound").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "fmini-sound";
const curName = () => (S.slot < S.names.length ? S.names[S.slot] : "") || "MY SOUND";

$("save").addEventListener("click", () => { download(currentSound(curName()), slug(curName()) + ".json"); msg(T("saved")); });
$("load").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.fmini1bkp === 1) { try { await restoreAll(o); } catch (err) { msg(T(err.code || "lost"), true); } return; }
    if (!validSound(o)) throw 0;
    if (!S.canPatch) throw 0;
    applySnap(objectToSnap(o)); msg(T("loaded"));
  } catch (_) { msg(T("badfile"), true); }
});

/* A/B: two settings, one on the device; edits go to the one that is showing */
const ab = { cur: "A", A: null, B: null };
function abShow() {
  $("ab").innerHTML = "A / B  <b></b>"; $("ab").querySelector("b").textContent = ab.cur;
  $("abcopy").textContent = T(ab.cur === "A" ? "abcopy" : "abcopyb");
}
function abReset() { ab.cur = "A"; ab.A = snapshot(); ab.B = snapshot(); abShow(); }
$("ab").addEventListener("click", () => {
  if (!ab.A) return;
  ab[ab.cur] = snapshot(); ab.cur = ab.cur === "A" ? "B" : "A"; applySnap(ab[ab.cur]); abShow();
});
$("abcopy").addEventListener("click", () => { if (!ab.A) return; ab[ab.cur === "A" ? "B" : "A"] = snapshot(); });
$("ab").title = T("abtip");

/* randomize: a fraction (the slider) of the way from the current sound to a random one, kept playable */
function randomize(amt) {
  const R = Math.random, f = amt / 100, p = S.patch.slice();
  const jit = (cur, lo, hi) => { const v = f >= 0.95 ? lo + R() * (hi - lo) : cur + (R() * 2 - 1) * f * (hi - lo) * 0.6; return Math.round(Math.max(lo, Math.min(hi, v))); };
  const pick = (cur, lo, hi) => (R() < f ? lo + Math.floor(R() * (hi - lo + 1)) : cur);
  for (const b of [FG.R1, FG.R2, FG.R3]) p[b] = pick(p[b], 1, 4);
  for (const b of [FG.W1, FG.W2, FG.W3]) p[b] = pick(p[b], 0, 5);
  p[FG.F2] = jit(p[FG.F2], 44, 84); p[FG.F3] = jit(p[FG.F3], 44, 84);
  p[FG.L1] = jit(p[FG.L1], 70, 127); p[FG.L2] = jit(p[FG.L2], 0, 127); p[FG.L3] = jit(p[FG.L3], 0, 127); p[FG.LN] = jit(p[FG.LN], 0, 60);
  p[FG.KBD] = jit(p[FG.KBD], 0, 127);
  let sw = p[FG.SW1];
  const flip = (bit, on) => { if (R() < f) sw = on ? sw | bit : sw & ~bit; };
  flip(FS.O2, R() < 0.8); flip(FS.O3, R() < 0.7); flip(FS.NZ, R() < 0.15); flip(FS.MOSC, R() < 0.2); flip(FS.MFLT, R() < 0.3);
  p[FG.SW1] = sw | FS.O1;                                                  /* (always something to hear) */
  const par = (id, lo, hi) => { const d = S.desc["0:" + id]; if (!d) return; const span = d.max - d.min; S.p[id] = jit(S.p[id], Math.round(d.min + lo * span), Math.round(d.min + hi * span)); queue("p" + id, setPar(id)); };
  par(S.pe0, 0.25, 1); par(S.pe0 + 1, 0, 0.7); par(S.pe0 + 2, 0, 1);
  par(S.pe0 + 3, 0, 0.5); par(S.pe0 + 4, 0.1, 1); par(S.pe0 + 5, 0, 1);
  par(P.ATK, 0, 0.45); par(P.DEC, 0.1, 1); par(P.SUS, 0.35, 1);
  S.patch = p;
  if (S.canPatch) queue("patch", putPatch());
  refreshAll();
}
$("amt").addEventListener("input", () => { $("amtv").textContent = $("amt").value + "%"; });
$("rnd").addEventListener("click", () => randomize(+$("amt").value));

/* ------------------------------------------------------------------------ library --- */
function busy(text) { document.body.classList.toggle("busy", !!text); $("busy").hidden = !text; $("busy").textContent = text || ""; }
async function withBusy(text, fn) {
  busy(text); const keep = touch.until; touch.until = Date.now() + 3600e3;
  try { return await fn(); } finally { touch.until = Date.now() + 600; busy(""); void keep; }
}
/* the PRESETS tab: the device's own 200 slots (0..99 factory, 100..199 INIT), named by NAMES and loaded with PRESET.
   Nothing is written from here: a slot is written on the device itself (SAVE) */
async function buildLib() {
  const panel = $("panel"); panel.textContent = "";
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const btn = (text, fn, cls) => { const b = mk("button", cls || "btn", text); b.addEventListener("click", fn); return b; };
  const g1 = mk("section", "grp"), row = mk("div", "libname"), hint = mk("div", "", T("libhint"));
  hint.style.cssText = "margin-top:10px;color:var(--mute);font-size:13px";
  g1.append(mk("h2", "", T("libtitle")), row, hint);
  row.append(btn(T("factexp"), exportFactory), btn(T("bakexp"), backupAll), btn(T("bakimp"), () => $("file").click()));
  const g2 = mk("section", "grp"); g2.append(mk("h2", "", T("lib")));
  const grid = mk("div", "slots"); g2.append(grid); panel.append(g1, g2);
  S.names.forEach((nm, i) => {
    const c = mk("div", "slot" + (nm ? "" : " empty"));
    c.append(mk("div", "sn", String(i).padStart(3, "0")), mk("div", "nm", nm || T("libempty")));
    c.append(mk("div", "act")); c.lastChild.append(btn(T("libload"), () => loadPreset(i), "mini"));
    grid.append(c);
  });
}
/* BACKUP (protocol 4): every preset of the device, as its record (hex), in one .bkp file (JSON). RESTORE: the device asks
 * first (its own question, NO by default); only on YES are the 200 records written */
const hexOf = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
const bytesOf = (h) => Uint8Array.from(h.match(/../g) || [], (x) => parseInt(x, 16));
async function fmRec(k) {
  const r = await req(CMD.FMINI_REC, [k & 127, k >> 7], 3000);
  if (r[2] !== 0) throw bad("recfail");
  const n = r[3] | r[4] << 7, out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = r[5 + 2 * i] | (r[6 + 2 * i] << 4);
  return out;
}
async function backupAll() {
  if (!S.canPatch) return;
  try {
    const slots = await withBusy(T("busybak"), async () => {
      const out = [];
      for (let k = 0; k < 200; k++) {
        out.push({ slot: k, rec: hexOf(await fmRec(k)) });
        if (k % 20 === 19) busy(T("busybak") + " " + (k + 1) + "/200");
      }
      return out;
    });
    download({ fmini1bkp: 1, protocol: 4, slots }, "fmini-1-backup.bkp");
    msg(T("bakdone"));
  } catch (e) { msg(T(e.code || "lost"), true); }
}
async function restoreAll(o) {
  const ok = Array.isArray(o.slots) && o.slots.length === 200 &&
    o.slots.every((x, i) => x && x.slot === i && typeof x.rec === "string" && /^([0-9a-f]{2}){1,128}$/.test(x.rec));
  if (!ok) throw bad("badbkp");
  const recs = o.slots.map((x) => bytesOf(x.rec));
  let asked = false;
  try {
    await withBusy(T("waitdev"), async () => {
      const r = await req(CMD.FMINI_RESTORE, [0], 1500);
      if (r[1] !== 0 || r[2] !== 1) throw bad("refused");
      asked = true;
      const t0 = Date.now();
      for (;;) {                                           /* the device answers: YES (2), or NO / a silent 60 s (3) */
        await sleep(300);
        const st = (await req(CMD.FMINI_RESTORE, [1], 1500))[2];
        if (st === 2) break;
        if (st !== 1 || Date.now() - t0 > 90000) throw bad("refused");
      }
      busy(T("busyrest"));
      for (let k = 0; k < 200; k++) {
        const rec = recs[k], a = [k & 127, k >> 7, rec.length & 127, rec.length >> 7];
        for (const b of rec) a.push(b & 15, b >> 4);
        const w = await req(CMD.FMINI_RPUT, a, 8000);
        if (w[2] !== 0) throw bad("restfail");
        if (k % 20 === 19) busy(T("busyrest") + " " + (k + 1) + "/200");
      }
    });
  } catch (e) {
    if (asked) { try { await req(CMD.FMINI_RESTORE, [2], 1500); } catch (_) { /* (the device ends the question on its own) */ } }
    throw e;
  }
  await req(CMD.FMINI_RESTORE, [2], 1500);
  await readNames(); fillPreset(); await pull(true);
  if (PAGES[S.page].lib) buildLib();
  msg(T("restdone"));
}
async function exportFactory() {
  const before = currentSound("");
  try {
    const slots = await withBusy(T("busyfact"), async () => {
      const out = [];
      for (let k = 0; k < 100; k++) {                     /* the factory bank: slots 0..99 (100..199 are INIT) */
        await req(CMD.PRESET, [S.fmini, k & 127, k >> 7], 1500); await sleep(30);
        const d = await req(CMD.DUMP, [], 1500), q = await req(CMD.FMINI_GET, [0, 0], 1500);
        const p = []; for (let i = 0; i < S.pCount; i++) p.push(rv(d, 2 + 2 * i));
        out.push({ slot: k, sound: soundObject(S.names[k], q.slice(3, 3 + FG.SIZE), p) });
      }
      return out;
    });
    download({ fmini1: 1, factory: 1, slots }, "fmini-1-factory-bank.json"); msg(T("factdone"));
  } catch (e) { fail(e); return; }
  try { await pull(true); applySnap(objectToSnap(before)); } catch (e) { fail(e); }   /* (the sound that was playing comes back) */
}

for (const el of document.querySelectorAll("[data-t]")) el.textContent = T(el.dataset.t);
$("connect").textContent = T("connect"); setStatus(false, T("disc")); $("rnd").textContent = T("rnd"); abShow();
tabs(); build();
window.__fmini = { S, req, connect, commit, PAGES, pull, ab };   /* (the tests drive the page through this) */
</script>
</body>
</html>
